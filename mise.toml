[tools]
pnpm = "latest"
pre-commit = "latest"
node = "24"

[env]
CICD_ACCOUNT_ID = "111111111111"
DEV_ACCOUNT_ID = "222222222222"
PROD_ACCOUNT_ID = "444444444444"
PAGERDUTY_EMAIL = "alerts@example.invalid"

[tasks.install]
description = "Install all dependencies"
run = [
    "pnpm install",
    "pre-commit install"
]

[tasks.pre-commit]
description = "Run pre-commit hooks on all files"
run = "pre-commit run --all-files"

[tasks.build]
description = "Build"
run = "pnpm run build"

[tasks.test]
description = "Build & run tests on all files"
depends = ["build"]
run = "pnpm run test"

[tasks.test-full]
description = "Build & run full test suite & synth all stack, pass a stack name to see the CFN"
depends = ["test", "pre-commit"]
run = "pnpm run cdk synth"

[tasks.synth]
description = "Build & synthesize all stacks, pass a stack name to see the CFN"
depends = ["build"]
run = "pnpm run cdk synth"

[tasks.diff]
description = "Build & see diff for all stacks, pass a stack name to filter"
depends = ["build"]
run = "pnpm run cdk diff"

[tasks.deploy]
description = "Deploy Stack(s), pass args (stacks) as needed, package is built before deployment"
depends = ["build"]
run = "pnpm run cdk deploy"
