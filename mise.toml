[tools]
pnpm = "latest"
pre-commit = "latest"
node = "24"

[tasks.install]
description = "Install all dependencies"
run = [
    "pnpm install",
    "pre-commit install"
]

[tasks.pre-commit]
description = "Run pre-commit hooks on all files"
run = "pre-commit run --all-files"

[tasks.build]
description = "Build"
run = "pnpm run build"

[tasks.test]
description = "Build & run tests on all files"
depends = ["build"]
run = "pnpm run test"

[tasks.test-full]
description = "Build & run full test suite & synth all stack, pass a stack name to see the CFN"
depends = ["test", "pre-commit"]
run = "pnpm run cdk synth"

[tasks.list]
description = "List all cdk stacks"
run = 'pnpm run cdk list'

[tasks.synth]
description = "Build & synthesize stacks (defaults to all with '**', or pass stack names)"
depends = ["build"]
usage = 'arg "[stacks]..." help="Stack names to synth (defaults to ** for all)"'
run = 'pnpm run cdk synth ${usage_stacks:-"**"}'

[tasks.diff]
description = "Build & see diff for stacks (defaults to all with '**', or pass stack names)"
depends = ["build"]
usage = 'arg "[stacks]..." help="Stack names to diff (defaults to ** for all)"'
run = 'pnpm run cdk diff ${usage_stacks:-"**"}'

[tasks.deploy]
description = "Deploy stacks (defaults to all with '**', or pass stack names)"
depends = ["build"]
usage = 'arg "[stacks]..." help="Stack names to deploy (defaults to ** for all)"'
run = 'pnpm run cdk deploy ${usage_stacks:-"**"}'

[tasks.pin]
description = "Pin an artifact at its currently deploying version; newer publishes only advance `latest`"
usage = '''
arg "<repo>" help="Source repo name, e.g. foerderturm"
arg "<kind>" help="Artifact kind: images or lambdas"
arg "<name>" help="Artifact name, e.g. dagster"
arg "<reason>" help="Why the artifact is pinned (stored as pinReason)"
'''
run = '''
jq --sort-keys --arg r "$usage_repo" --arg k "$usage_kind" --arg n "$usage_name" --arg why "$usage_reason" \
  'if .repositories[$r][$k][$n] then .repositories[$r][$k][$n] |= (.pinned = (.pinned // .latest) | .pinReason = $why) else error("no entry \($r)/\($k)/\($n)") end' \
  version-manifests/latest.json > version-manifests/latest.json.tmp \
  && mv version-manifests/latest.json.tmp version-manifests/latest.json \
  && echo "Pinned $usage_repo/$usage_kind/$usage_name at $(jq -r ".repositories[\"$usage_repo\"][\"$usage_kind\"][\"$usage_name\"].pinned.version" version-manifests/latest.json). To pin an older version, edit the pinned block manually (copy it from git history). Commit & push to apply."
'''

[tasks.unpin]
description = "Unpin an artifact: the latest published version deploys again"
usage = '''
arg "<repo>" help="Source repo name, e.g. foerderturm"
arg "<kind>" help="Artifact kind: images or lambdas"
arg "<name>" help="Artifact name, e.g. dagster"
'''
run = '''
jq --sort-keys --arg r "$usage_repo" --arg k "$usage_kind" --arg n "$usage_name" \
  'if .repositories[$r][$k][$n] then .repositories[$r][$k][$n] |= del(.pinned, .pinReason) else error("no entry \($r)/\($k)/\($n)") end' \
  version-manifests/latest.json > version-manifests/latest.json.tmp \
  && mv version-manifests/latest.json.tmp version-manifests/latest.json \
  && echo "Unpinned $usage_repo/$usage_kind/$usage_name -> $(jq -r ".repositories[\"$usage_repo\"][\"$usage_kind\"][\"$usage_name\"].latest.version" version-manifests/latest.json). Commit & push to apply."
'''
