name: test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Pre-commit
        run: mise run pre-commit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Build and Test
        run: mise run test
      - name: CDK Synth
        run: pnpm run cdk synth
      - name: CDK Diff
        run: pnpm run cdk diff || true
