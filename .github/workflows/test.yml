name: test
# For local testing with act see: https://github.com/nektos/act/issues/2370

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Pre-commit
        run: mise run pre-commit

  test:
    runs-on: ubuntu-latest
    env:
      CICD_ACCOUNT_ID: ${{ vars.CICD_ACCOUNT_ID }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
      PROD_ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
      CICD_REGION: ${{ vars.CICD_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Set AWS role name
        run: echo "ROLE_NAME=${{ github.event.repository.name }}-${{ github.ref_name }}-github-actions-role" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.CICD_REGION }}
          role-session-name: GitHubActions-Test-${{ github.run_id }}
      - name: Build
        run: mise run build
      - name: Diff CDK
        run: mise run diff-ci
