name: test

on:
  pull_request:
  push:
    branches:
      - master

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Pre-commit
        run: mise run pre-commit

  test:
    runs-on: ubuntu-latest
    env:
      CICD_ACCOUNT_ID: ${{ vars.CICD_ACCOUNT_ID }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
      PROD_ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
      CICD_REGION: ${{ vars.CICD_REGION }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        run: mise run install
      - name: Build and Test
        run: mise run test
      - name: Set role name
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          if [[ "$GITHUB_REF" == refs/pull/* ]]; then
            # It's a pull request
            BRANCH_NAME=$GITHUB_HEAD_REF
          else
            # It's a regular push
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          echo "ROLE_NAME=${REPO_NAME}-${BRANCH_NAME}-github-actions-role" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.CICD_REGION }}
          role-session-name: GitHubActions-Test-${{ github.run_id }}
      - name: CDK Synth
        run: pnpm run cdk synth
      - name: CDK Diff
        run: pnpm run cdk diff || true
