name: Test & Deploy CDK
# For local testing with act see: https://github.com/nektos/act/issues/2370

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

# Don't deploy at the same time to master or dev (Prod or Dev account)
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'deploy_master' || 'deploy' }}
  cancel-in-progress: false

env:
  CICD_ACCOUNT_ID: ${{ vars.CICD_ACCOUNT_ID }}
  DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
  PROD_ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  PAGERDUTY_EMAIL: ${{ vars.PAGERDUTY_EMAIL }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
  MISE_OVERRIDE_CONFIG_FILENAMES: 'mise.ci.toml'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: mise run install-ci

      - name: Pre-commit
        run: mise run pre-commit-ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: mise run install-ci

      - name: Set AWS role name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ROLE_NAME=${{ github.event.repository.name }}-github-actions-role" >> $GITHUB_ENV
          else
            echo "ROLE_NAME=${{ github.event.repository.name }}-${{ github.ref_name }}-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Test-${{ github.run_id }}

      - name: Build
        run: mise run build-ci

      - name: Test
        run: mise run test-ci

      - name: Diff CDK
        run: mise run diff-ci

  deploy:
    runs-on: ubuntu-latest
    needs: [pre-commit, test]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: mise run install-ci

      # If it's any other branch than master we assume the role without branch name, it only allows to deploy to Dev
      - name: Set AWS role name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ROLE_NAME=${{ github.event.repository.name }}-github-actions-role" >> $GITHUB_ENV
          else
            echo "ROLE_NAME=${{ github.event.repository.name }}-${{ github.ref_name }}-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Build
        run: mise run build-ci

      - name: CDK Deploy to CI/CD
        if: github.ref == 'refs/heads/master'
        run: mise run deploy-ci *Cicd --require-approval never

      # Always deploy to Dev from any branch
      - name: CDK Deploy to Dev
        run: mise run deploy-ci *Dev --require-approval never

      - name: CDK Deploy to Production
        if: github.ref == 'refs/heads/master'
        run: mise run deploy-ci *Prod --require-approval never
