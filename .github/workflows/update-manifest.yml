name: Update Version Manifest

on:
  workflow_dispatch:
    inputs:
      repoName:
        description: 'Repository name'
        required: true
        type: string
      commitSha:
        description: 'Commit SHA'
        required: true
        type: string
      sourceRepo:
        description: 'Source repository (org/repo format)'
        required: true
        type: string
      artifacts:
        description: 'JSON string containing artifacts array'
        required: true
        type: string

# Concurrency: serialize manifest updates to avoid conflicts
concurrency:
  group: update-manifest
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Write deployment metadata
        run: |
          # Reconstruct metadata from workflow inputs for validation
          cat > /tmp/metadata.json <<EOF
          {
            "repoName": "${{ inputs.repoName }}",
            "commitSha": "${{ inputs.commitSha }}",
            "sourceRepo": "${{ inputs.sourceRepo }}",
            "artifacts": ${{ inputs.artifacts }}
          }
          EOF
          echo "Received metadata:"
          cat /tmp/metadata.json

      - name: Update version manifest
        id: update
        run: |
          python3 .github/scripts/update_version_manifest.py \
            --from-metadata /tmp/metadata.json

      - name: Commit and push manifest update
        id: commit
        if: steps.update.outputs.updated == 'true'
        env:
          REPO_NAME: ${{ inputs.repoName }}
          COMMIT_SHA: ${{ inputs.commitSha }}
          SOURCE_REPO: ${{ inputs.sourceRepo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version-manifests/latest.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Build detailed artifact list with versions and types
          ARTIFACT_LIST=$(echo '${{ inputs.artifacts }}' \
            | jq -r '.[] | "- \(.name)@\(.version) (\(.type))"' \
            | paste -sd '\n')

          git commit -m "chore: update from ${SOURCE_REPO}

          ${ARTIFACT_LIST}

          Commit: ${COMMIT_SHA}"

          # Retry push with conflict resolution in case of concurrent updates
          for i in {1..5}; do
            if git push; then
              echo "Successfully pushed manifest update"
              echo "committed=true" >> $GITHUB_OUTPUT
              break
            else
              echo "Push failed (attempt $i/5), retrying in $((i * 2)) seconds..."
              sleep $((i * 2))

              # Abort any failed rebase and reset to clean state
              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD

              # Fetch latest changes
              git fetch origin master
              git reset --hard origin/master

              # Re-run the update script to merge changes properly
              python3 .github/scripts/update_version_manifest.py \
                --from-metadata /tmp/metadata.json

              # Stage and commit again
              git add version-manifests/latest.json

              if git diff --staged --quiet; then
                echo "No changes after re-update, manifest may already be current"
                echo "committed=false" >> $GITHUB_OUTPUT
                exit 0
              fi

              git commit -m "chore: update from ${SOURCE_REPO}

          ${ARTIFACT_LIST}

          Commit: ${COMMIT_SHA}"
            fi
          done

          # Check if we exhausted retries
          if ! git diff --quiet HEAD origin/master 2>/dev/null; then
            echo "Failed to push after 5 attempts"
            exit 1
          fi

  deploy:
    needs: update-manifest
    if: needs.update-manifest.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
