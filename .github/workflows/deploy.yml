name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'bin/**'
      # Manifest commits (pushed by app repos via seilbahn's update-version-manifest
      # action) trigger the same synth-based change detection as code changes.
      - 'version-manifests/**'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Which pipeline(s) to trigger'
        required: true
        type: choice
        options:
          - auto
          - infra
          - prod
          - all
        default: auto
  workflow_call:
    inputs:
      pipeline:
        description: 'Which pipeline(s) to trigger (infra, prod, all)'
        required: true
        type: string

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  ROLE_NAME: ${{ github.event.repository.name }}-prod-github-actions-role
  MISE_OVERRIDE_CONFIG_FILENAMES: 'mise.ci.toml'

jobs:
  # Synth CDK templates and compare checksums to detect real changes.
  # Only runs in auto mode (push to master). Skipped for explicit pipeline selection.
  synth-detect:
    if: inputs.pipeline == '' || inputs.pipeline == 'auto'
    runs-on: ubuntu-latest
    environment:
      name: dev
    outputs:
      infra_changed: ${{ steps.diff.outputs.infra_changed }}
      prod_changed: ${{ steps.diff.outputs.prod_changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install dependencies
        run: mise run install-ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-dev-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-SynthDetect-${{ github.run_id }}

      - name: Build & Synth
        run: |
          mise run build-ci
          pnpm run cdk synth --quiet 2>/dev/null || true

      - name: Compute template checksums
        id: checksums
        run: |
          # Hash all CloudFormation templates grouped by pipeline.
          # Includes both the pipeline stack templates AND the nested stage
          # assembly templates (e.g. assembly-InfrastructurePipeline-CicdStage/*.template.json)
          # so that changes to application stacks are detected too.
          cd cdk.out

          pipeline_hash() {
            local prefix="$1"
            find . \( -name "${prefix}*.template.json" -o -path "./assembly-${prefix}*/*.template.json" \) \
              -print0 | sort -z | xargs -0 sha256sum 2>/dev/null
          }

          echo "infra=$(pipeline_hash InfrastructurePipeline | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "prod=$(pipeline_hash ProductionPipeline | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore previous checksums
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .template-checksums
          key: template-checksums-${{ github.sha }}
          restore-keys: |
            template-checksums-

      - name: Compare against previous checksums
        id: diff
        run: |
          INFRA_CHANGED=true
          PROD_CHANGED=true

          if [ -f .template-checksums ]; then
            PREV_INFRA=$(grep '^infra=' .template-checksums | cut -d= -f2)
            PREV_PROD=$(grep '^prod=' .template-checksums | cut -d= -f2)

            if [ "$PREV_INFRA" = "${{ steps.checksums.outputs.infra }}" ]; then
              INFRA_CHANGED=false
              echo "Infrastructure templates unchanged"
            else
              echo "Infrastructure templates changed"
            fi

            if [ "$PREV_PROD" = "${{ steps.checksums.outputs.prod }}" ]; then
              PROD_CHANGED=false
              echo "Production templates unchanged"
            else
              echo "Production templates changed"
            fi
          else
            echo "No previous checksums found, treating all as changed"
          fi

          echo "infra_changed=$INFRA_CHANGED" >> "$GITHUB_OUTPUT"
          echo "prod_changed=$PROD_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Save current checksums
        run: |
          echo "infra=${{ steps.checksums.outputs.infra }}" > .template-checksums
          echo "prod=${{ steps.checksums.outputs.prod }}" >> .template-checksums

      - name: Cache checksums
        uses: actions/cache/save@v6
        with:
          path: .template-checksums
          key: template-checksums-${{ github.sha }}

  # Resolves which pipelines to trigger.
  # For auto mode, reads synth-detect outputs. For explicit mode, uses the input directly.
  resolve:
    needs: synth-detect
    if: always()
    runs-on: ubuntu-latest
    outputs:
      trigger_infra: ${{ steps.resolve.outputs.trigger_infra }}
      trigger_prod: ${{ steps.resolve.outputs.trigger_prod }}
    steps:
      - name: Resolve which pipelines to trigger
        id: resolve
        run: |
          PIPELINE="${{ inputs.pipeline || 'auto' }}"

          case "$PIPELINE" in
            all)
              TRIGGER_INFRA=true
              TRIGGER_PROD=true
              ;;
            infra)
              TRIGGER_INFRA=true
              TRIGGER_PROD=false
              ;;
            prod)
              TRIGGER_INFRA=false
              TRIGGER_PROD=true
              ;;
            auto)
              TRIGGER_INFRA=${{ needs.synth-detect.outputs.infra_changed }}
              TRIGGER_PROD=${{ needs.synth-detect.outputs.prod_changed }}
              ;;
          esac

          echo "trigger_infra=$TRIGGER_INFRA" >> "$GITHUB_OUTPUT"
          echo "trigger_prod=$TRIGGER_PROD" >> "$GITHUB_OUTPUT"

          echo "Pipeline selection: $PIPELINE"
          echo "  Infra: $TRIGGER_INFRA"
          echo "  Prod:  $TRIGGER_PROD"

  deploy-infra:
    needs: resolve
    if: always() && needs.resolve.outputs.trigger_infra == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-InfrastructurePipeline-${{ github.run_id }}

      - name: Trigger Infrastructure Pipeline
        run: |
          echo "Triggering Infrastructure CDK Pipeline..."
          aws codepipeline start-pipeline-execution --name ${{ vars.INFRA_CDK_PIPELINE_NAME }}
          echo "Infrastructure CDK Pipeline triggered successfully"

  deploy-prod:
    needs: resolve
    if: always() && needs.resolve.outputs.trigger_prod == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-ProductionPipeline-${{ github.run_id }}

      - name: Trigger Production Pipeline
        run: |
          echo "Triggering Production CDK Pipeline..."
          aws codepipeline start-pipeline-execution --name ${{ vars.PROD_CDK_PIPELINE_NAME }}
          echo "Production CDK Pipeline triggered successfully"
