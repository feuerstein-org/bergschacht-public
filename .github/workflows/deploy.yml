name: Deploy CDK
# For local testing with act see: https://github.com/nektos/act/issues/2370

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CICD_ACCOUNT_ID: ${{ vars.CICD_ACCOUNT_ID }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
      PROD_ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
      CICD_REGION: ${{ vars.CICD_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: mise run install

      - name: Set AWS role name
        run: echo "ROLE_NAME=${{ github.event.repository.name }}-${{ github.ref_name }}-github-actions-role" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.CICD_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Build
        run: mise run build

      - name: Diff CDK
        run: mise run diff-ci

      - name: CDK Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        run: mise run deploy *Dev --require-approval never

      - name: CDK Deploy to CI/CD
        if: github.ref == 'refs/heads/master'
        run: mise run deploy *Cicd --require-approval never

      - name: CDK Deploy to Production
        if: github.ref == 'refs/heads/master'
        run: mise run deploy *Prod --require-approval never
