name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'version-manifests/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update Version Manifest'] # Trigger deployment after manifest update
    types:
      - completed

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  ROLE_NAME: ${{ github.event.repository.name }}-prod-github-actions-role

jobs:
  deploy-cdk:
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-CDK-${{ github.run_id }}

      - name: Trigger CDK Pipeline
        run: |
          echo "Triggering CDK Pipeline deployment..."
          aws codepipeline start-pipeline-execution --name ${{ vars.PROD_CDK_PIPELINE_NAME }}
          echo "CDK Pipeline triggered successfully"
