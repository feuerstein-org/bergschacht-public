default_stages: [pre-commit]
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # ESLint and Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: 'pnpm run format'
        language: system
        args: ['--write']

      - id: eslint
        name: eslint
        entry: 'pnpm run lint'
        language: system
        pass_filenames: false

      - id: validate-version-manifests
        name: validate version manifests
        entry: bash -c 'find version-manifests/ -name "*.json" ! -name "*.schema.json" -exec ajv validate -s version-manifests/version-manifest.schema.json -d {} --spec=draft2020 \;'
        language: system
        pass_filenames: false

      - id: printf-log-formatter
        name: printf-log-formatter
        entry: uv run printf-log-formatter
        language: system
        types: [python]
        args:
          - --log-level=debug

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check
        language: system
        types: [python]
        args: [--fix]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyupgrade
        name: pyupgrade
        entry: uv run pyupgrade
        language: system
        types: [python]
        args: ['--py314-plus']

  # Check Dockerfile exists for each Python package -- add this if package uses Docker
