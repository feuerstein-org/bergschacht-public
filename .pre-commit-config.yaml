default_stages: [pre-commit]
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Version manifest schema validation
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.0
    hooks:
      - id: check-jsonschema
        name: validate version manifest
        files: ^version-manifests/latest\.json$
        args: ['--schemafile', 'version-manifests/version-manifest.schema.json']

  # ESLint and Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: 'pnpm run format'
        language: system
        args: ['--write']

      - id: eslint
        name: eslint
        entry: 'pnpm run lint'
        language: system
        pass_filenames: false
